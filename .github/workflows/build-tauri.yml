name: Build Tauri

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
            rust-targets: x86_64-pc-windows-msvc
            artifact-name: xiaoxi-windows-nsis
            artifact-path: src-tauri/target/release/bundle/nsis/*.exe
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg
            rust-targets: aarch64-apple-darwin
            artifact-name: xiaoxi-macos-aarch64
            artifact-path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg
            rust-targets: x86_64-apple-darwin
            artifact-name: xiaoxi-macos-x64
            artifact-path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.artifact-name }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Build and publish GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: 小息 ${{ github.ref_name }}
          releaseBody: |
            - Windows：下载 `*-setup.exe`，双击安装（当前用户，一般不需要管理员权限）。
            - macOS Apple 芯片（M 系列）：下载 `*aarch64.dmg`。
            - macOS Intel：下载 `*x64.dmg`。

            macOS 未签名时，若提示无法打开：在安装包上右键 → 打开，或到「系统设置 → 隐私与安全性」允许。
          releaseDraft: false
          prerelease: false

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
